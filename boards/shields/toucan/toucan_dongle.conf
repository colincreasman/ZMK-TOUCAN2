# Toucan dongle (central). Board-agnostic: any BLE-capable ZMK board works as
# the dongle. The PandaKB dongle's OLED wiring lives in the pandakb_dongle
# shield, and the status screen itself comes from englmaxi's dongle_display.

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_BATTERY_REPORTING=y

# The pointer pipeline and the custom gesture behaviors all run on the central,
# so the dongle needs the same input thread headroom the left half has when it
# is the central.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Maximum radio power. The dongle is normally USB powered, and the extra link
# margin to both halves is worth far more than the current it costs.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deliberately NO CONFIG_ZMK_SLEEP here. Deep sleep is only ever woken by a key
# press, and the dongle has no keys, so it would never wake up again without a
# manual reset. (ZMK already skips deep sleep while on USB power, but the dongle
# also has its own battery for wireless use.)

# Status screen (englmaxi/zmk-dongle-display). The dongle has its own battery,
# and macOS is this keyboard's primary host, so show its modifier glyphs.
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
