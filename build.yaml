# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # ---- Standalone mode: the left half is the central ------------------------
  - board: seeeduino_xiao_ble
    shield: toucan_left rgbled_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  # The right half is a peripheral in BOTH modes, so this one build serves
  # standalone and dongle mode alike.
  - board: seeeduino_xiao_ble
    shield: toucan_right rgbled_adapter
  - board: seeeduino_xiao_ble
    shield: settings_reset

  # ---- Dongle mode: the PandaKB USB dongle is the central -------------------
  # See "Dongle mode" in the README for the one-time flashing procedure.
  - board: nice_nano_v2
    shield: toucan_dongle pandakb_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: toucan_dongle
  # toucan_left_peripheral turns the left half into a plain peripheral.
  - board: seeeduino_xiao_ble
    shield: toucan_left toucan_left_peripheral rgbled_adapter nice_view_gem
    artifact-name: toucan_left_dongle_mode
  # The dongle is a nice!nano, a different board from the halves' XIAO, so it
  # needs its own settings reset image.
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset_dongle
