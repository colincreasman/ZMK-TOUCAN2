description: |
  Windows three-finger contact holds Alt until the contact ends.
  Parameter 0 = right, 1 = left, 2 = up, 3 = down, 4 = contact.
  Left/right presses navigate repeatedly during contact; direction releases
  do nothing.
  Up/down end navigation until the next contact.
  Contact press/release starts/ends the session. Mac gestures do not use this behavior.

compatible: "zmk,behavior-win-switcher"

include: one_param.yaml

properties:
  tap-ms:
    type: int
    default: 12
    description: >
      Gap between key reports in a swipe sequence, allowing the host to see
      distinct taps. This is not a contact-release timeout.
